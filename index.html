<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Connexion administrateur — ETHAN MULTI SERVICES</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111c2e;--muted:#667085;--line:#e4e8ee;--accent:#14243d;--accent2:#1f3a63;--bg:#f3f5f8;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;grid-template-rows:1fr auto;padding:20px;-webkit-font-smoothing:antialiased}
main{display:grid;place-items:center}
.card{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 32px 30px;box-shadow:0 1px 2px #10182808,0 20px 50px -20px #14243d33}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.brand{font-size:12px;letter-spacing:.14em;font-weight:800;line-height:1.3}.brand small{display:block;letter-spacing:0;font-weight:500;color:var(--muted);font-size:12px}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}.sub{color:var(--muted);font-size:14px;margin:0 0 6px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin:20px 0 7px}
.field{position:relative}
input{width:100%;border:1px solid #d3d9e2;border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #1f3a6322}
#password{padding-right:74px}
.toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 10px;background:none;border:0;color:var(--accent2);font-size:12px;font-weight:600;border-radius:8px;cursor:pointer}
.toggle:hover{background:#eef2f8}
.submit{width:100%;border:0;border-radius:10px;padding:13px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;margin-top:26px;cursor:pointer;transition:background .15s}
.submit:hover{background:var(--accent2)}.submit:disabled{opacity:.65;cursor:wait}
button:focus-visible{outline:3px solid #1f3a6344;outline-offset:2px}
.msg{display:none;margin-top:16px;padding:11px 13px;border-radius:10px;font-size:13px;background:#fef3f2;border:1px solid #fecdca;color:var(--danger)}
.hint{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--muted);margin-top:22px}
footer{text-align:center;font-size:12px;color:#8a94a6;padding-top:18px}
</style></head>
<body>
<main><div class="card">
 <div class="logo"><div class="mark" aria-hidden="true">E</div><div class="brand">ETHAN MULTI SERVICES<small>Administration</small></div></div>
 <h1>Connexion</h1><p class="sub">Accédez à l'espace de gestion de votre boutique.</p>
 <form id="loginForm" novalidate>
  <label for="username">Identifiant</label>
  <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
  <label for="password">Mot de passe</label>
  <div class="field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="toggle" id="toggle" aria-label="Afficher le mot de passe">Afficher</button></div>
  <button class="submit" id="submit" type="submit">Se connecter</button>
  <div id="msg" class="msg" role="alert"></div>
 </form>
 <div class="hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Accès réservé à l'administration</div>
</div></main>
<footer>© <span id="y"></span> ETHAN MULTI SERVICES</footer>
<script>
const API="https://edhfmgyqqrbgstmjvmlf.supabase.co/functions/v1";
const TOKEN_KEY="ethan_admin_token";
const $=id=>document.getElementById(id);
$("y").textContent=new Date().getFullYear();
if(localStorage.getItem(TOKEN_KEY)){location.replace("admin.html")}
$("toggle").addEventListener("click",()=>{const p=$("password"),show=p.type==="password";p.type=show?"text":"password";$("toggle").textContent=show?"Masquer":"Afficher";$("toggle").setAttribute("aria-label",show?"Masquer le mot de passe":"Afficher le mot de passe")});
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();const msg=$("msg"),btn=$("submit");
 const username=$("username").value.trim(),password=$("password").value;
 msg.style.display="none";
 if(!username||!password){msg.textContent="Veuillez renseigner l'identifiant et le mot de passe.";msg.style.display="block";return}
 btn.disabled=true;btn.textContent="Connexion en cours…";
 try{
  const r=await fetch(API+"/admin-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",username,password})});
  const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Identifiants incorrects.");
  localStorage.setItem(TOKEN_KEY,d.token);location.href="admin.html";
 }catch(err){msg.textContent=err instanceof TypeError?"Connexion impossible. Vérifiez votre réseau et réessayez.":(err.message||"Une erreur est survenue.");msg.style.display="block";$("password").select()}
 finally{btn.disabled=false;btn.textContent="Se connecter"}
});
</script></body></html>
